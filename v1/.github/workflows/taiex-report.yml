# 放在儲存庫的 .github/workflows/taiex-report.yml（覆蓋舊內容）
# 輕量、快速：只產生大盤報告與篩選頁並發佈，不跑耗時的評價與走勢（那些在 taiex-heavy.yml）
# 程式檔放在儲存庫的 v1 資料夾
name: taiex-report

on:
  schedule:
    # cron 以 UTC 計算，台灣時間 = UTC + 8
    - cron: "40 0 * * 1-5"        # 台灣時間 08:40（開盤前）
    - cron: "*/10 1-5 * * 1-5"    # 台灣時間 09:00～13:59，每 10 分鐘（盤中）
    - cron: "30 8 * * 1-5"        # 台灣時間 16:30（收盤後）
    - cron: "*/30 10-21 * * 1-5"  # 台灣時間 18:00～隔日 05:59，每 30 分鐘（海外市場）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v1/requirements.txt

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 預測紀錄與逐日法人（本 workflow 會更新，所以也要儲存）
      - name: 還原快取（預測與法人歷史）
        uses: actions/cache/restore@v4
        with:
          path: |
            v1/cache/predictions.json
            v1/cache/inst_hist.json
          key: state-none
          restore-keys: state-

      # 個股評價、走勢統計、ETF（由 taiex-heavy.yml 更新，這裡只讀取）
      - name: 還原快取（評價、走勢、ETF）
        uses: actions/cache/restore@v4
        with:
          path: |
            v1/cache/scores.json
            v1/cache/trends.json
            v1/cache/etf.json
          key: heavy-none
          restore-keys: heavy-

      - name: 大盤分析
        id: market
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          python taiex_analyzer.py --no-open --refresh 300 2>&1 | tee market.log

      - name: 全市場篩選與評價頁
        id: uni
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          python stock_universe.py --no-open 2>&1 | tee universe.log

      - name: 儲存快取（預測與法人歷史）
        if: always() && hashFiles('v1/cache/predictions.json', 'v1/cache/inst_hist.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            v1/cache/predictions.json
            v1/cache/inst_hist.json
          key: state-${{ hashFiles('v1/cache/predictions.json', 'v1/cache/inst_hist.json') }}

      # 某一步失敗時，網站仍會發佈，並在該頁顯示「這次產生失敗」，不會默默停在舊資料
      - name: 組合網站
        if: always()
        env:
          M_OK: ${{ steps.market.outcome }}
          U_OK: ${{ steps.uni.outcome }}
        run: |
          mkdir -p site
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          V=$(date +%s)
          page() {  # $1 檔名 $2 步驟結果 $3 標題 $4 記錄檔
            if [ "$2" = "success" ] && [ -f "$1" ]; then cp "$1" "site/$1"; else
              LOG=$(tail -n 30 "$4" 2>/dev/null | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
              printf '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>%s</title></head><body style="font:16px system-ui,sans-serif;padding:16px"><h2>%s</h2><p style="color:#b45309">⚠ 這次（%s）產生失敗。最後的執行記錄如下，把它貼給我就能判斷原因：</p><pre style="white-space:pre-wrap;font-size:12px;background:#f6f7f9;color:#1d2330;padding:8px;border-radius:6px">%s</pre><p><a href="index.html">回首頁</a></p></body></html>' "$3" "$3" "$NOW" "$LOG" > "site/$1"
            fi
          }
          page taiex_report.html "$M_OK" "大盤分析" market.log
          page universe.html "$U_OK" "全市場篩選與評價" universe.log
          {
            echo '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股報告</title></head><body style="font:16px system-ui,sans-serif;padding:16px;line-height:1.9">'
            echo "<h1>台股報告</h1><p>網站組合時間：$NOW（台灣時間）｜排程快照，非逐筆即時</p>"
            echo "<p>大盤分析：$M_OK｜全市場篩選：$U_OK</p><ul><li><a href=\"taiex_report.html?v=$V\">大盤 K 線與隔日行情分析</a></li>"
            echo "<li><a href=\"universe.html?v=$V\">全市場篩選與評價（類股、連漲連跌、K 棒、圖形型態、法人、委買委賣、權證、ETF）</a></li>"
            echo '</ul><p style="color:#666">規則式計算，僅供研究參考，不構成投資建議。</p><script>setTimeout(function(){location.replace(location.pathname+"?t="+Date.now())},300000)</script></body></html>'
          } > site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v1/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
